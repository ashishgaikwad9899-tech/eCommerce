<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Shopcart | Cart</title>

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header class="header">
      <div class="container navbar">
        <a href="index.html" class="logo"> Shop<span>cart</span> </a>

        <nav class="nav-links">
          <a href="index.html">Home</a>

          <a href="products.html">Shop</a>

          <a href="category.html">Categories</a>

          <a href="wishlist.html">Wishlist</a>

          <a href="orders.html">Orders</a>
        </nav>

        <div class="nav-right">
          <a href="cart.html" class="nav-icon active"> Cart </a>

          <a href="login.html" class="login-btn"> Login </a>
        </div>
      </div>
    </header>

    <section class="page-header">
      <div class="container">
        <p>SHOPPING CART</p>

        <h1>Your Cart</h1>
      </div>
    </section>

    <section class="section">
      <div class="container cart-layout">
        <div class="cart-items">
          <div class="cart-item">
            <img src="images/product1.webp" alt="Smart Watch" />

            <div class="cart-product">
              <h3>Smart Watch Pro</h3>

              <p>Electronics</p>

              <strong> ₹2,499 </strong>
            </div>

            <input type="number" value="1" min="1" />
          </div>

          <div class="cart-item">
            <img src="images/product2.webp" alt="Sneakers" />

            <div class="cart-product">
              <h3>Urban Sneakers</h3>

              <p>Footwear</p>

              <strong> ₹1,799 </strong>
            </div>

            <input type="number" value="1" min="1" />
          </div>
        </div>

        <div class="cart-summary">
          <h2>Order Summary</h2>

          <div class="summary-row">
            <span> Subtotal </span>

            <strong> ₹4,298 </strong>
          </div>

          <div class="summary-row">
            <span> Delivery </span>

            <strong> Free </strong>
          </div>

          <div class="summary-row total">
            <span> Total </span>

            <strong> ₹4,298 </strong>
          </div>

          <a href="checkout.html" class="btn-primary full-btn">
            Proceed to Checkout
          </a>
        </div>
      </div>
    </section>

    <footer class="footer">
      <div class="footer-bottom">© 2026 Shopcart. All rights reserved.</div>
    </footer>
  </body>
</html>
