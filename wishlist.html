<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Shopcart | Wishlist</title>

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header class="header">
      <div class="container navbar">
        <a href="index.html" class="logo"> Shop<span>cart</span> </a>

        <nav class="nav-links">
          <a href="index.html">Home</a>

          <a href="products.html">Shop</a>

          <a href="category.html">Categories</a>

          <a href="wishlist.html" class="active"> Wishlist </a>

          <a href="orders.html"> Orders </a>
        </nav>

        <div class="nav-right">
          <a href="cart.html" class="nav-icon"> Cart </a>

          <a href="login.html" class="login-btn"> Login </a>
        </div>
      </div>
    </header>

    <section class="page-header">
      <div class="container">
        <p>YOUR SAVED PRODUCTS</p>

        <h1>Wishlist</h1>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="product-grid">
          <div class="product-card">
            <div class="product-image">
              <img src="images/product3.webp" alt="Headphones" />
            </div>

            <div class="product-info">
              <p class="product-category">Accessories</p>

              <h3>Wireless Headphones</h3>

              <div class="product-bottom">
                <strong> ₹3,299 </strong>

                <a href="cart.html"> Add to Cart </a>
              </div>
            </div>
          </div>

          <div class="product-card">
            <div class="product-image">
              <img src="images/product6.webp" alt="Hoodie" />
            </div>

            <div class="product-info">
              <p class="product-category">Fashion</p>

              <h3>Classic Hoodie</h3>

              <div class="product-bottom">
                <strong> ₹1,499 </strong>

                <a href="cart.html"> Add to Cart </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <footer class="footer">
      <div class="footer-bottom">© 2026 Shopcart. All rights reserved.</div>
    </footer>
  </body>
</html>
