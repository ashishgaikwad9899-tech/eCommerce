<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Shopcart | Checkout</title>

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header class="header">
      <div class="container navbar">
        <a href="index.html" class="logo"> Shop<span>cart</span> </a>

        <nav class="nav-links">
          <a href="index.html">Home</a>

          <a href="products.html">Shop</a>

          <a href="category.html">Categories</a>

          <a href="wishlist.html">Wishlist</a>

          <a href="orders.html">Orders</a>
        </nav>

        <div class="nav-right">
          <a href="cart.html" class="nav-icon"> Cart </a>

          <a href="login.html" class="login-btn"> Login </a>
        </div>
      </div>
    </header>

    <section class="page-header">
      <div class="container">
        <p>CHECKOUT</p>

        <h1>Complete Your Order</h1>
      </div>
    </section>

    <section class="section">
      <div class="container checkout-layout">
        <div class="checkout-form">
          <h2>Delivery Information</h2>

          <label> Full Name </label>

          <input type="text" placeholder="Enter your name" />

          <label> Email Address </label>

          <input type="email" placeholder="Enter your email" />

          <label> Phone Number </label>

          <input type="tel" placeholder="Enter phone number" />

          <label> Address </label>

          <textarea placeholder="Enter your complete address"> </textarea>

          <label> City </label>

          <input type="text" placeholder="Enter city" />

          <label> Pincode </label>

          <input type="text" placeholder="Enter pincode" />

          <h2 class="payment-title">Payment Method</h2>

          <label class="radio-option">
            <input type="radio" name="payment" />

            Cash on Delivery
          </label>

          <label class="radio-option">
            <input type="radio" name="payment" />

            UPI / Online Payment
          </label>

          <button class="btn-primary order-btn">Place Order</button>
        </div>

        <div class="cart-summary">
          <h2>Your Order</h2>

          <div class="summary-row">
            <span> Smart Watch Pro </span>

            <strong> ₹2,499 </strong>
          </div>

          <div class="summary-row">
            <span> Urban Sneakers </span>

            <strong> ₹1,799 </strong>
          </div>

          <div class="summary-row">
            <span> Delivery </span>

            <strong> Free </strong>
          </div>

          <div class="summary-row total">
            <span> Total </span>

            <strong> ₹4,298 </strong>
          </div>
        </div>
      </div>
    </section>

    <footer class="footer">
      <div class="footer-bottom">© 2026 Shopcart. All rights reserved.</div>
    </footer>
  </body>
</html>
